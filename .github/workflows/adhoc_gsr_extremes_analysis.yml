name: (temp) Gold/Silver Ratio Extremes Analysis

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python scripts/adhoc_gsr_extremes_analysis.py
